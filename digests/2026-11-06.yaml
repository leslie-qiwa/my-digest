  - url: https://golangweekly.com/link/192619/rss
    title: Go's GC Can Hit a Wall on 192 Cores
    summary: I doubt many of us work with such mammoth systems, but on 192-core amd64
      hosts, heap-triggered GC cycles can take 3-4x longer as idle cores pile onto
      a shared lock-free stack. arm64 already has mitigations for this, and fixes
      are in review.
