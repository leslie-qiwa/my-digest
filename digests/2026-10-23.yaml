  items:
  - url: https://golangweekly.com/link/191929/rss
    title: Interactive Refactoring in gopls
    summary: LSP refactorings can't 'ask' you anything, so "Add struct tags" in gopls
      just guessed json and camelCase. gopls can now pop up dialogs to collect your
      input. It uses a stateless, form-like protocol extension the Go and Dart teams
      have proposed as an LSP standard.
    score: 0
    tags: []
    source: go.dev
    domain: go.dev
    summary_zh: ''
    content_file: ''
  - url: https://golangweekly.com/link/191931/rss
    title: Go Hardcodes a Block on Broken eMudhra Certs
    summary: 🚫 — Eight intermediate CA certificates had trivially recoverable private
      keys, so Go 1.27.3 and 1.26.10 now refuse chains through them. It's hardcoded
      because, as Filippo Valsorda notes, Linux trust stores have no way to pass revocations
      on to apps.
    score: 0
    tags: []
    source: github.com
    domain: github.com
    summary_zh: ''
    content_file: ''
  - url: https://golangweekly.com/link/191945/rss
    title: Better HTTP/1 Connection Reuse
    summary: You can now (mostly) stop draining HTTP/1 response bodies in Go 1.27
      as the client now drains the leftovers in the background, within limits, making
      io.Copy(io.Discard, resp.Body) helpers largely redundant when you close the
      body.
    score: 0
    tags: []
    source: go.dev
    domain: go.dev
    summary_zh: ''
    content_file: ''
  - url: https://golangweekly.com/link/191947/rss
    title: 'SIMD and Go: How the New Packages Work Under the Hood'
    summary: A heavily illustrated tour of Go's experimental SIMD support, covering
      what vector instructions actually do, the operations offered by simd/archsimd
      and the new portable simd package, and how the compiler turns them into machine
      code.
    score: 0
    tags: []
    source: internals-for-interns.com
    domain: internals-for-interns.com
    summary_zh: ''
    content_file: ''
  - url: https://golangweekly.com/link/191956/rss
    title: 'TinyGo 0.43: Go for Microcontrollers and WebAssembly'
    summary: The Go compiler 'for small places' closes more gaps with regular Go,
      adding testing/synctest, parallel tests, panic recovery on Wasm, and more. Much
      of the work comes from Jake Bailey of TypeScript's Go port fame.
    score: 0
    tags: []
    source: github.com
    domain: github.com
    summary_zh: ''
    content_file: ''
  - url: https://golangweekly.com/link/191958/rss
    title: 'coregex: A Faster Drop-In Replacement for regexp'
    summary: Brings the multi-engine design of Rust's regex crate to Go, with lazy
      DFA, PikeVM, one-pass matching and SIMD prefilters. The author claims 15–240x
      speedups.
